apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
    app: nginx
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80
      command: ["/bin/sh"]
      args: ["-c", "nginx -g 'daemon off;' && sed -i 's/80/8080/g' /etc/nginx/conf.d/default.conf && nginx -s reload"]
